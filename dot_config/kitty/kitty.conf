# Select a theme by changing the relative theme.conf symlink.
include ./theme.conf

# Environment
# term xterm-256color

# Window
remember_window_size yes
initial_window_width 100c
initial_window_height 30c
placement_strategy center
window_padding_width 0
hide_window_decorations no
background_opacity 0.8

# Font: auto selects the family's Bold, Italic and Bold Italic faces.
font_family JetBrainsMono NF
bold_font auto
italic_font auto
bold_italic_font auto
font_size 20.0

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# Selection and cursor
copy_on_select clipboard
cursor_shape underline
cursor_shape_unfocused hollow
cursor_blink_interval 0
# Prevent shell integration from replacing the underline with a beam.
shell_integration no-cursor
cursor_trail 1

# Mouse
mouse_hide_wait -1
mouse_map middle release ungrabbed paste_from_selection

# Keyboard: Kitty's scroll actions pass through on the alternate screen.
map ctrl+l send_text all \x0c
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+0 change_font_size all 0

# Search uses Kitty's scrollback pager (less), rather than Alacritty's UI.
map ctrl+shift+f search_scrollback
map ctrl+shift+b combine : show_scrollback : send_key ?

# No direct Kitty config equivalents:
# - general.live_config_reload (reload manually with Ctrl+Shift+F5)
# - env.WINIT_X11_SCALE_FACTOR (specific to Alacritty's windowing backend)
# - window.title and window.class (Kitty uses --title/--class/--name flags)
# - window.decorations_theme_variant
# - colors.draw_bold_text_with_bright_colors
# - selection.semantic_escape_chars (Kitty uses word inclusion characters)
# - cursor.thickness (fraction of cell height vs Kitty's point units)
# - Copy/Paste named keys (not recognized by Kitty's key parser)
# - ClearLogNotice and Vi-mode bindings/conditions (Alacritty-specific)
